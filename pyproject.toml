[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-tripwire"
version = "0.1.0"
description = "Canary tokens for LLM applications: detect system prompt leaks, RAG exfiltration and agent misuse, even when the model reformats or encodes what it leaks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Osama Wehbi" }]
keywords = ["canary-tokens", "honeytokens", "deception", "llm-security", "ai-security", "prompt-leakage", "data-exfiltration", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.12,<3",
    "rich>=13.7",
    "typer>=0.29.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
]

[project.scripts]
llm-tripwire = "llm_tripwire.cli:main"

[project.urls]
Homepage = "https://github.com/OsamaWehbi/llm-tripwire"
Issues = "https://github.com/OsamaWehbi/llm-tripwire/issues"
Changelog = "https://github.com/OsamaWehbi/llm-tripwire/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tripwire"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "SIM", "RUF"]
ignore = ["E501", "S101", "RUF001", "RUF002", "RUF003", "RUF012", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S310", "S311", "S603"]
"src/llm_tripwire/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
