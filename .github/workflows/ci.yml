name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Example runs and blocks the leak
        shell: bash
        run: |
          set +e
          python examples/stream_guard.py
          test $? -eq 1
      - name: Tests
        run: pytest

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install . bandit pip-audit
      - name: Bandit (SAST)
        run: bandit -q -r src -c pyproject.toml
      - name: pip-audit (dependency CVEs)
        run: pip-audit --progress-spinner off --skip-editable
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
